name = "moments-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moments-db"
database_id = "095593d9-c5a2-466b-a3c2-3dc5c4ae8bdc"

# R2 存储绑定
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "moments-storage"

# 环境变量：JWT_SECRET 走 wrangler secret put JWT_SECRET 设置，不写进文件
[vars]
CORS_ORIGIN = "*"
APP_VERSION = "1.0.0"
